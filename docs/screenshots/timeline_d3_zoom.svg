<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f0883e" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="url(#bg)" rx="10" stroke="#30363d" stroke-width="1.5" />

  <!-- Title bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#21262d" rx="10 10 0 0" />
  <circle cx="24" cy="21" r="5" fill="#f85149" />
  <circle cx="40" cy="21" r="5" fill="#d29922" />
  <circle cx="56" cy="21" r="5" fill="#3fb950" />
  <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f0883e">Eje Temporal Interactivo D3.js (Focus + Context Brushing &amp; Zooming)</text>

  <!-- Interactive Controls Bar -->
  <rect x="20" y="52" width="960" height="40" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1" />
  <text x="32" y="76" font-family="monospace" font-size="11" fill="#8b949e">MODO DE INTERACCIÓN:</text>
  <rect x="180" y="60" width="120" height="24" rx="4" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-width="1" />
  <text x="190" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#f0883e">✥ Paneo &amp; Zoom</text>
  <rect x="310" y="60" width="110" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="320" y="76" font-family="monospace" font-size="11" fill="#8b949e">▭ Brush Directo</text>

  <!-- Presets -->
  <text x="440" y="76" font-family="monospace" font-size="11" fill="#8b949e">SALTAR A FASE:</text>
  <rect x="540" y="60" width="70" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="548" y="76" font-family="monospace" font-size="10" fill="#f85149">F1 RDP</text>
  <rect x="616" y="60" width="80" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="624" y="76" font-family="monospace" font-size="10" fill="#d29922">F2 Persist</text>
  <rect x="702" y="60" width="84" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="710" y="76" font-family="monospace" font-size="10" fill="#f0883e">F3 Inyec.</text>
  <rect x="792" y="60" width="80" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="800" y="76" font-family="monospace" font-size="10" fill="#3fb950">F4 DNS</text>
  <rect x="878" y="60" width="90" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="886" y="76" font-family="monospace" font-size="10" fill="#a371f7">F5 Cloud</text>

  <!-- Zoom buttons -->
  <g font-family="monospace" font-size="12" fill="#58a6ff">
    <rect x="910" y="104" width="28" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="919" y="120">+</text>
    <rect x="942" y="104" width="28" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="953" y="120">-</text>
  </g>

  <!-- Focus View Lanes -->
  <g font-family="monospace" font-size="11" fill="#8b949e">
    <text x="30" y="140">EVTX Logs</text>
    <line x1="150" y1="136" x2="970" y2="136" stroke="#30363d" stroke-dasharray="3,3" />

    <text x="30" y="180">Prefetch</text>
    <line x1="150" y1="176" x2="970" y2="176" stroke="#30363d" stroke-dasharray="3,3" />

    <text x="30" y="220">Registro</text>
    <line x1="150" y1="216" x2="970" y2="216" stroke="#30363d" stroke-dasharray="3,3" />

    <text x="30" y="260">MFT Filesystem</text>
    <line x1="150" y1="256" x2="970" y2="256" stroke="#30363d" stroke-dasharray="3,3" />

    <text x="30" y="300">Red &amp; C2</text>
    <line x1="150" y1="296" x2="970" y2="296" stroke="#30363d" stroke-dasharray="3,3" />

    <text x="30" y="340">AWS CloudTrail</text>
    <line x1="150" y1="336" x2="970" y2="336" stroke="#30363d" stroke-dasharray="3,3" />
  </g>

  <!-- Focus Events Nodes -->
  <circle cx="210" cy="136" r="8" fill="#f85149" stroke="#fff" stroke-width="2" />
  <circle cx="270" cy="136" r="10" fill="#3fb950" stroke="#fff" stroke-width="2.5" />
  <circle cx="360" cy="176" r="8" fill="#58a6ff" stroke="#fff" stroke-width="2" />
  <circle cx="430" cy="216" r="8" fill="#d29922" stroke="#fff" stroke-width="2" />
  <circle cx="530" cy="256" r="8" fill="#58a6ff" stroke="#fff" stroke-width="2" />
  <circle cx="610" cy="176" r="11" fill="#f0883e" stroke="#fff" stroke-width="2.5" />
  <circle cx="680" cy="296" r="9" fill="#f85149" stroke="#fff" stroke-width="2" />
  <circle cx="750" cy="296" r="7" fill="#f85149" stroke="#fff" stroke-width="1.5" />
  <circle cx="820" cy="296" r="8" fill="#3fb950" stroke="#fff" stroke-width="2" />
  <circle cx="910" cy="336" r="9" fill="#a371f7" stroke="#fff" stroke-width="2" />

  <!-- Selected Node Detail Banner -->
  <rect x="520" y="112" width="280" height="48" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1.5" />
  <text x="532" y="130" font-family="monospace" font-size="11" font-weight="700" fill="#f0883e">02:18:22 UTC - Inyección VAD</text>
  <text x="532" y="146" font-family="monospace" font-size="10" fill="#c9d1d9">PAGE_EXECUTE_READWRITE en PID 612</text>

  <!-- Context Minimap / Brush Navigator -->
  <rect x="20" y="380" width="960" height="74" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1.5" />
  <text x="32" y="398" font-family="monospace" font-size="10" font-weight="600" fill="#8b949e">MINIMAPA DE NAVEGACIÓN TEMPORAL (2026-03-14 02:01:44 → 02:31:05 UTC)</text>
  
  <!-- Mini timeline ticks and nodes -->
  <line x1="32" y1="422" x2="968" y2="422" stroke="#30363d" stroke-width="2" />
  <circle cx="120" cy="422" r="3" fill="#f85149" />
  <circle cx="180" cy="422" r="4" fill="#3fb950" />
  <circle cx="300" cy="422" r="3" fill="#58a6ff" />
  <circle cx="450" cy="422" r="4" fill="#d29922" />
  <circle cx="560" cy="422" r="5" fill="#f0883e" />
  <circle cx="680" cy="422" r="4" fill="#f85149" />
  <circle cx="780" cy="422" r="4" fill="#3fb950" />
  <circle cx="890" cy="422" r="4" fill="#a371f7" />

  <!-- D3.js Brush Selector Box -->
  <rect x="420" y="404" width="310" height="38" rx="4" fill="url(#brushGrad)" stroke="#f0883e" stroke-width="1.5" />
  <!-- Left Handle -->
  <rect x="416" y="413" width="7" height="20" rx="3" fill="#f0883e" />
  <line x1="419" y1="417" x2="419" y2="429" stroke="#000" stroke-width="1" />
  <!-- Right Handle -->
  <rect x="727" y="413" width="7" height="20" rx="3" fill="#f0883e" />
  <line x1="730" y1="417" x2="730" y2="429" stroke="#000" stroke-width="1" />
  
  <text x="470" y="428" font-family="monospace" font-size="10" font-weight="700" fill="#f0883e">02:14:00 - 02:24:00 (Ventana 10m)</text>
  <text x="750" y="438" font-family="monospace" font-size="9" fill="#8b949e">Arrastra o redimensiona para hacer zoom</text>
</svg>
